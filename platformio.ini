; PlatformIO Irrigation8266 Configuration File
[platformio]
src_dir = .
default_envs = WEMOS_D1_Mini

[env]
build_flags = -Wno-deprecated-declarations -Wno-sign-compare
lib_deps =
	bblanchon/ArduinoJson @ ^6.21.3
	knolleary/PubSubClient @ ^2.8
	https://github.com/witnessmenow/Universal-Arduino-Telegram-Bot.git

[env:ESP8266-ESP01]
board = esp01_1m
platform = espressif8266
framework = arduino
monitor_speed = 115200
board_build.ldscript = eagle.flash.1m64.ld

[env:WEMOS_D1_Mini]
platform = espressif8266
board = d1_mini
framework = arduino
monitor_speed = 115200
upload_speed = 460800
; Aligns flash layout to default Arduino IDE settings
board_build.ldscript = eagle.flash.4m2m.ld

[env:ESP32DEV]
platform = espressif32
board = esp32dev
framework = arduino
build_flags = -D CORE_DEBUG_LEVEL=0
